# Builds the Slow Breath Android app (APK) on GitHub's servers.
# Run it from the Actions tab: "Build Android APK" > "Run workflow".
name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Collect the web app files
        run: |
          mkdir www
          cp index.html manifest.webmanifest icon-*.png www/

      - name: Install Capacitor
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Icons, background colour and vibration permission
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image

          res = "android/app/src/main/res"
          icon = Image.open("icon-512.png").convert("RGBA")
          mask = Image.open("icon-maskable-512.png").convert("RGBA")

          legacy = {"mdpi": 48, "hdpi": 72, "xhdpi": 96, "xxhdpi": 144, "xxxhdpi": 192}
          adaptive = {"mdpi": 108, "hdpi": 162, "xhdpi": 216, "xxhdpi": 324, "xxxhdpi": 432}
          for d, px in legacy.items():
              for name in ("ic_launcher.png", "ic_launcher_round.png"):
                  icon.resize((px, px), Image.LANCZOS).save(f"{res}/mipmap-{d}/{name}")
          for d, px in adaptive.items():
              mask.resize((px, px), Image.LANCZOS).save(f"{res}/mipmap-{d}/ic_launcher_foreground.png")

          with open(f"{res}/values/ic_launcher_background.xml", "w") as f:
              f.write('<?xml version="1.0" encoding="utf-8"?>\n<resources>\n'
                      '    <color name="ic_launcher_background">#0B1C21</color>\n</resources>\n')

          p = "android/app/src/main/AndroidManifest.xml"
          m = open(p).read()
          if "VIBRATE" not in m:
              m = m.replace(
                  '<uses-permission android:name="android.permission.INTERNET" />',
                  '<uses-permission android:name="android.permission.INTERNET" />\n'
                  '    <uses-permission android:name="android.permission.VIBRATE" />')
          assert "VIBRATE" in m, "could not add the vibration permission"
          open(p, "w").write(m)
          PY

      - name: Sync web files into the app
        run: npx cap sync android

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk slow-breath.apk

      - name: Keep a copy on the run page
        uses: actions/upload-artifact@v4
        with:
          name: slow-breath-apk
          path: slow-breath.apk
          retention-days: 90

      - name: Publish a release with the APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "apk-${{ github.run_number }}" slow-breath.apk \
            --title "Slow Breath APK #${{ github.run_number }}" \
            --notes "Debug build of the Slow Breath app. Download slow-breath.apk and open it on your phone."
